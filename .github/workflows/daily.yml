name: Daily collectors

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC, about 5 to 6am Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_all.py
        env:
          LEGISTAR_TOKEN_CHARLOTTE: ${{ secrets.LEGISTAR_TOKEN_CHARLOTTE }}
      - name: Save results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update radar data $(date -u +%F)"
          git push
